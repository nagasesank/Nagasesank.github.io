<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Security Capability Stack</title><desc id="desc">Six grouped cloud security capability domains.</desc>
  <rect width="1100" height="650" fill="#0b1725"/>
  <g font-family="Arial, sans-serif" fill="#dce8f1"><g fill="#67e8f9" font-size="15"><text x="45" y="55">CLOUD PLATFORMS</text><text x="405" y="55">CLOUD SECURITY</text><text x="760" y="55">DEVSECOPS / IAC</text><text x="45" y="300">DETECTION / MONITORING</text><text x="405" y="300">GOVERNANCE / ASSURANCE</text><text x="760" y="300">AI / SECURITY AUTOMATION</text></g><g font-size="18"><text x="45" y="95">AWS · Microsoft Azure · Google Cloud</text><text x="405" y="95">IAM · Entra ID · Azure RBAC · Zero Trust</text><text x="405" y="125">OIDC · Workload Identity · SCPs</text><text x="405" y="155">Network Security · AWS WAF · Cloud Armor</text><text x="760" y="95">Terraform · Infrastructure as Code</text><text x="760" y="125">Policy as Code · Git · GitHub Actions</text><text x="760" y="155">Validation · Remediation · Revalidation</text><text x="45" y="340">CloudTrail · GuardDuty · EventBridge</text><text x="45" y="370">Audit Logging · Investigation · Incident Response</text><text x="405" y="340">Governance Controls · NIST · ISO 27001</text><text x="405" y="370">HIPAA/HITRUST-Aligned Engineering</text><text x="405" y="400">PCI DSS · SOC 2 · Engineering Evidence</text><text x="760" y="340">Security Automation</text><text x="760" y="370">AI-Assisted Incident Triage — Learning Focus</text><text x="760" y="400">Amazon Bedrock Integration — Planned Work</text></g><g stroke="#20364b" fill="none"><rect x="25" y="25" width="320" height="200"/><rect x="385" y="25" width="320" height="200"/><rect x="740" y="25" width="330" height="200"/><rect x="25" y="270" width="320" height="200"/><rect x="385" y="270" width="320" height="200"/><rect x="740" y="270" width="330" height="200"/></g><text x="45" y="575" font-size="16" fill="#94a3b8">Framework references describe engineering context, not organizational compliance or attestation.</text></g>
</svg>
